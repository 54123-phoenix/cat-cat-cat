name: Build & Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install 'Pillow>=10'
      - run: python scripts/check_assets.py cat-frontend/public showcase
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: cat-frontend/package-lock.json }
      - run: cd cat-frontend && npm ci
      - run: cd cat-frontend && npm run typecheck
      - run: cd cat-frontend && npm test
      - run: cd cat-frontend && npm run lint
      - run: cd cat-frontend && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: cat-frontend/dist/

  build-miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install 'Pillow>=10'
      - run: python scripts/check_assets.py cat-miniprogram/src/assets
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: cat-miniprogram/package-lock.json }
      - run: cd cat-miniprogram && npm ci
      - run: cd cat-miniprogram && npm run typecheck
      - run: cd cat-miniprogram && npm test
      - run: cd cat-miniprogram && npm run build:weapp
      - run: python scripts/check_assets.py cat-miniprogram/dist/assets
      - uses: actions/upload-artifact@v4
        with:
          name: miniprogram-dist
          path: cat-miniprogram/dist/

  check-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r cat-backend/requirements-dev.txt
      - run: cd cat-backend && python -m compileall app/
      - run: cd cat-backend && DATABASE_URL=sqlite:// INIT_DEMO_USER=0 JWT_SECRET=ci-test-secret ADMIN_PASSWORD=ci-admin-pass REFERENCE_STORE= REFERENCE_TEST_EVIDENCE_DIR=../artifacts/reference-processes pytest tests/ -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-process-results
          path: artifacts/reference-processes/
          if-no-files-found: warn

  redis-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python -m pip install -r cat-backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: python scripts/verify_redis_runtime.py --redis-server redis-server --output-dir artifacts/redis-runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redis-runtime-results
          path: artifacts/redis-runtime/
          if-no-files-found: warn

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: cat-frontend/package-lock.json }
      - run: python -m pip install -r cat-backend/requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_assets.py cat-frontend/public showcase
      - run: cd cat-frontend && npm ci
      - run: python scripts/verify_browser.py --output-dir artifacts/browser-ci
      - run: python scripts/verify_reference_browser.py --output-dir artifacts/reference-browser-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-results
          path: |
            artifacts/browser-ci/
            artifacts/reference-browser-ci/
          if-no-files-found: warn
